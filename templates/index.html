<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엑셀 대시보드 빌더</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        /* 헤더 */
        .header {
            background: linear-gradient(135deg, #1e3a5f, #2d6a9f);
            color: #fff;
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
        }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header small { opacity: .75; font-size: 13px; }

        /* 업로드 영역 */
        .upload-section {
            max-width: 720px;
            margin: 40px auto;
            text-align: center;
        }
        .drop-zone {
            border: 3px dashed #b0c4de;
            border-radius: 16px;
            padding: 60px 30px;
            background: #fff;
            cursor: pointer;
            transition: .2s;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            border-color: #2d6a9f;
            background: #eaf2fb;
        }
        .drop-zone svg { width: 56px; height: 56px; fill: #2d6a9f; margin-bottom: 16px; }
        .drop-zone p { font-size: 16px; color: #555; margin-bottom: 8px; }
        .drop-zone small { color: #999; }
        #fileInput { display: none; }

        /* 로딩 */
        .loader-wrap {
            display: none;
            text-align: center;
            padding: 60px;
        }
        .loader-wrap.show { display: block; }
        .spinner {
            width: 48px; height: 48px;
            border: 5px solid #e0e0e0;
            border-top-color: #2d6a9f;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 대시보드 */
        .dashboard { display: none; padding: 0 32px 60px; max-width: 1400px; margin: 0 auto; }
        .dashboard.show { display: block; }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin: 32px 0 16px;
            padding-left: 12px;
            border-left: 4px solid #2d6a9f;
        }

        /* 요약 카드 */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        .card .label { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 6px; }
        .card .value { font-size: 24px; font-weight: 700; color: #1e3a5f; }
        .card .sub { font-size: 12px; color: #aaa; margin-top: 4px; }

        /* 통계 테이블 */
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        .stats-table th, .stats-table td {
            padding: 12px 16px;
            text-align: right;
            border-bottom: 1px solid #f0f0f0;
        }
        .stats-table th {
            background: #f7f9fb;
            font-size: 13px;
            color: #666;
            text-align: right;
        }
        .stats-table th:first-child, .stats-table td:first-child { text-align: left; font-weight: 600; }
        .stats-table tr:last-child td { border-bottom: none; }

        /* 차트 그리드 */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
            gap: 24px;
        }
        .chart-box {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        .chart-box h3 {
            font-size: 15px;
            margin-bottom: 16px;
            color: #444;
        }
        .chart-box canvas { width: 100% !important; max-height: 340px; }

        /* 데이터 미리보기 */
        .preview-wrap {
            overflow-x: auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .preview-table th {
            position: sticky; top: 0;
            background: #1e3a5f;
            color: #fff;
            padding: 10px 14px;
            text-align: left;
            white-space: nowrap;
        }
        .preview-table td {
            padding: 8px 14px;
            border-bottom: 1px solid #f0f0f0;
            white-space: nowrap;
        }
        .preview-table tr:hover td { background: #f7f9fb; }

        /* 새 파일 버튼 */
        .btn-new {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 28px;
            background: #2d6a9f;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-new:hover { background: #1e3a5f; }

        /* 반응형 */
        @media (max-width: 600px) {
            .header { padding: 16px 20px; }
            .chart-grid { grid-template-columns: 1fr; }
            .dashboard { padding: 0 12px 40px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>Excel Dashboard Builder</h1>
        <small>소상공인을 위한 엑셀 시각화 도구</small>
    </div>
    <div>
        <button class="btn-new" id="btnReset" style="display:none;">+ 새 파일 업로드</button>
    </div>
</div>

<!-- 업로드 -->
<div class="upload-section" id="uploadSection">
    <div class="drop-zone" id="dropZone">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6zm8-6v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <p>엑셀 파일을 드래그하거나 클릭하여 업로드하세요</p>
        <small>.xlsx, .xls, .csv 지원 (최대 16MB)</small>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
</div>

<!-- 로딩 -->
<div class="loader-wrap" id="loader">
    <div class="spinner"></div>
    <p>데이터를 분석 중입니다...</p>
</div>

<!-- 대시보드 -->
<div class="dashboard" id="dashboard">
    <!-- 요약 -->
    <div class="section-title">파일 요약</div>
    <div class="summary-cards" id="summaryCards"></div>

    <!-- 통계 -->
    <div class="section-title" id="statsTitle" style="display:none;">컬럼별 통계</div>
    <div id="statsWrap"></div>

    <!-- 차트 -->
    <div class="section-title" id="chartsTitle" style="display:none;">시각화</div>
    <div class="chart-grid" id="chartGrid"></div>

    <!-- 미리보기 -->
    <div class="section-title">데이터 미리보기 (상위 30행)</div>
    <div class="preview-wrap">
        <table class="preview-table" id="previewTable"></table>
    </div>
</div>

<script>
const COLORS = [
    'rgba(45,106,159,.75)', 'rgba(231,76,60,.75)', 'rgba(46,204,113,.75)',
    'rgba(241,196,15,.75)', 'rgba(155,89,182,.75)', 'rgba(52,73,94,.75)',
    'rgba(230,126,34,.75)', 'rgba(26,188,156,.75)', 'rgba(192,57,43,.75)',
    'rgba(127,140,141,.75)'
];
const BORDER_COLORS = COLORS.map(c => c.replace(',.75)', ',1)'));
let chartInstances = [];

const dropZone     = document.getElementById('dropZone');
const fileInput    = document.getElementById('fileInput');
const uploadSec    = document.getElementById('uploadSection');
const loader       = document.getElementById('loader');
const dashboard    = document.getElementById('dashboard');
const btnReset     = document.getElementById('btnReset');

// 드래그 & 드롭
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

btnReset.addEventListener('click', () => {
    dashboard.classList.remove('show');
    btnReset.style.display = 'none';
    uploadSec.style.display = '';
    fileInput.value = '';
});

async function handleFile(file) {
    uploadSec.style.display = 'none';
    loader.classList.add('show');

    const form = new FormData();
    form.append('file', file);

    try {
        const res  = await fetch('/upload', { method: 'POST', body: form });
        const data = await res.json();

        if (!res.ok) {
            alert(data.error || '업로드 실패');
            uploadSec.style.display = '';
            loader.classList.remove('show');
            return;
        }

        loader.classList.remove('show');
        renderDashboard(data);
    } catch (err) {
        alert('서버 오류: ' + err.message);
        uploadSec.style.display = '';
        loader.classList.remove('show');
    }
}

function renderDashboard(data) {
    // 기존 차트 제거
    chartInstances.forEach(c => c.destroy());
    chartInstances = [];

    // 요약 카드
    const cards = document.getElementById('summaryCards');
    cards.innerHTML = `
        <div class="card">
            <div class="label">파일명</div>
            <div class="value" style="font-size:16px;word-break:break-all;">${data.summary.filename}</div>
        </div>
        <div class="card">
            <div class="label">총 행 수</div>
            <div class="value">${data.summary.rows.toLocaleString()}</div>
        </div>
        <div class="card">
            <div class="label">컬럼 수</div>
            <div class="value">${data.summary.columns.length}</div>
            <div class="sub">${data.summary.columns.join(', ')}</div>
        </div>
        <div class="card">
            <div class="label">숫자 컬럼</div>
            <div class="value">${data.numeric_cols.length}</div>
            <div class="sub">${data.numeric_cols.join(', ') || '-'}</div>
        </div>
        <div class="card">
            <div class="label">텍스트 컬럼</div>
            <div class="value">${data.text_cols.length}</div>
            <div class="sub">${data.text_cols.join(', ') || '-'}</div>
        </div>
    `;

    // 통계 테이블
    const statsWrap = document.getElementById('statsWrap');
    const statsTitle = document.getElementById('statsTitle');
    const statKeys = Object.keys(data.stats);
    if (statKeys.length) {
        statsTitle.style.display = '';
        let html = `<table class="stats-table">
            <tr><th>컬럼</th><th>합계</th><th>평균</th><th>최대</th><th>최소</th></tr>`;
        statKeys.forEach(col => {
            const s = data.stats[col];
            html += `<tr>
                <td>${col}</td>
                <td>${s['합계'].toLocaleString()}</td>
                <td>${s['평균'].toLocaleString()}</td>
                <td>${s['최대'].toLocaleString()}</td>
                <td>${s['최소'].toLocaleString()}</td>
            </tr>`;
        });
        html += '</table>';
        statsWrap.innerHTML = html;
    } else {
        statsTitle.style.display = 'none';
        statsWrap.innerHTML = '';
    }

    // 차트
    const chartsTitle = document.getElementById('chartsTitle');
    const chartGrid   = document.getElementById('chartGrid');
    chartGrid.innerHTML = '';
    if (data.charts.length) {
        chartsTitle.style.display = '';
        data.charts.forEach((chart, i) => {
            const box = document.createElement('div');
            box.className = 'chart-box';
            box.innerHTML = `<h3>${chart.title}</h3><canvas id="chart${i}"></canvas>`;
            chartGrid.appendChild(box);

            const ctx = document.getElementById(`chart${i}`).getContext('2d');
            const datasets = chart.datasets.map((ds, di) => ({
                label: ds.label,
                data: ds.data,
                backgroundColor: chart.type === 'pie'
                    ? COLORS.slice(0, ds.data.length)
                    : COLORS[di % COLORS.length],
                borderColor: chart.type === 'line'
                    ? BORDER_COLORS[di % BORDER_COLORS.length]
                    : 'rgba(255,255,255,.6)',
                borderWidth: chart.type === 'line' ? 2 : 1,
                tension: 0.3,
                fill: chart.type === 'line',
            }));

            chartInstances.push(new Chart(ctx, {
                type: chart.type,
                data: { labels: chart.labels.map(String), datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: chart.type === 'pie' ? 'right' : 'top', labels: { font: { size: 12 } } },
                    },
                    scales: chart.type === 'pie' ? {} : {
                        y: { beginAtZero: true, ticks: { font: { size: 11 } } },
                        x: { ticks: { font: { size: 11 }, maxRotation: 45 } },
                    },
                },
            }));
        });
    } else {
        chartsTitle.style.display = 'none';
    }

    // 미리보기 테이블
    const table = document.getElementById('previewTable');
    if (data.preview.length) {
        const cols = Object.keys(data.preview[0]);
        let html = '<thead><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
        data.preview.forEach(row => {
            html += '<tr>' + cols.map(c => `<td>${row[c] !== null && row[c] !== undefined ? row[c] : ''}</td>`).join('') + '</tr>';
        });
        html += '</tbody>';
        table.innerHTML = html;
    }

    dashboard.classList.add('show');
    btnReset.style.display = '';
}
</script>
</body>
</html>
